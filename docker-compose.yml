version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: edutech_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/backend:ro
    depends_on:
      - backend
      - frontend
    networks:
      - edutech_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edutech_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
    environment:
      - APP_NAME="أكاديمية التعلم"
      - APP_ENV=production
      - APP_KEY=base64:X8n53j84e72vV91y9YfV/cO8m+Kk9+h2D3H1j5K7L8A=
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/backend/database/database.sqlite
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    networks:
      - edutech_network

  frontend:
    image: node:20-alpine
    container_name: edutech_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - edutech_network

networks:
  edutech_network:
    driver: bridge
